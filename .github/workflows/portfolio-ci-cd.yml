name: Portfolio CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Reject legacy JavaScript migration files
        run: npm run check:legacy

      - name: Reject active object-storage integration
        run: npm run check:no-r2

      - name: Reject legacy permanent admin-token authentication
        run: npm run check:no-legacy-auth

      - name: Lint
        run: npm run lint

      - name: Type-check frontend and Worker
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate D1 migrations locally
        run: npm run db:migrate:local

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://kirolos-portfolio-api.linc-ministry.workers.dev

      - name: Bundle Worker without deploying
        run: npm run worker:dry-run

  deploy-worker:
    name: Deploy Cloudflare Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run worker:deploy

  deploy-frontend:
    name: Deploy Netlify frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VITE_API_BASE_URL: https://kirolos-portfolio-api.linc-ministry.workers.dev
    steps:
      - name: Validate Netlify deployment secrets
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build production frontend
        run: npm run build

      - name: Deploy prebuilt frontend to Netlify
        run: npx netlify deploy --prod --dir=dist --message="GitHub ${GITHUB_SHA}"
